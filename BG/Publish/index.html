<div class="modal hidden" id="addExerciseModal">
  <div class="modal-panel x-exercise-sheet">
    <div class="x-sheet-handle" aria-hidden="true"></div>
    <div class="modal-head x-modal-top-bar eg-choose-exercise-header-bar">
      <div class="modal-title-row x-modal-title-area eg-choose-exercise-title-row">
